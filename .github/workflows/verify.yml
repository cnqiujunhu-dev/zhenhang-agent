name: build-and-smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes -r app/requirements-dev.lock -r app/requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e app
      - name: Fresh configuration and data smoke checks
        working-directory: app
        run: python scripts/run_checks.py --suite bootstrap
      - name: Exact amounts and request idempotency
        working-directory: app
        run: python -m pytest tests/test_quality_amount_memo_repairs.py tests/test_request_idempotency.py -q
      - name: Build and check the web interface
        working-directory: app/web
        run: |
          npm ci
          npm run build
          node --test tests/*.test.mjs
