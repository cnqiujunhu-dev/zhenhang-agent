<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">圳行Agent · Zhenhang Agent</title>
  <desc id="description">理解需求、查询与办理、根据结果回答。六场景共用网页和Android后端。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f7f3"/><stop offset="1" stop-color="#e9f1f5"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bdd8d3" stroke-width=".6" opacity=".35"/></pattern>
  </defs>
  <rect width="1280" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="22" fill="url(#grid)"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="42" y="43" width="6" height="24" rx="3" fill="#0c8b7e"/>
    <text x="62" y="62" font-size="17" fill="#168277" letter-spacing="2">ZHENHANG AGENT</text>
    <text x="42" y="126" font-size="44" fill="#173744" font-weight="700">圳行Agent</text>
    <text x="43" y="164" font-size="20" fill="#506b75">理解需求 → 查询与办理 → 根据结果回答</text>
    <text x="43" y="202" font-size="16" fill="#5c737b">连续对话 · 来源校验 · 持久任务 · 事务账务</text>
    <g transform="translate(680 53)">
      <rect width="239" height="57" rx="12" fill="#fff" stroke="#c9ddda"/>
      <text x="119" y="35" text-anchor="middle" font-size="18" fill="#214b53">网页 / Android</text>
      <path d="M119 61V82" fill="none" stroke="#148b7e" stroke-width="2"/>
      <path d="m114 77 5 5 5-5" fill="none" stroke="#148b7e" stroke-width="2"/>
      <rect x="0" y="88" width="239" height="57" rx="12" fill="#166f6d"/>
      <text x="119" y="123" text-anchor="middle" font-size="18" fill="#fff">统一会话与业务执行</text>
      <path d="M246 116H275" stroke="#148b7e" stroke-width="2"/>
      <path d="m270 111 5 5-5 5" fill="none" stroke="#148b7e" stroke-width="2"/>
      <rect x="282" y="88" width="227" height="57" rx="12" fill="#fff" stroke="#c9ddda"/>
      <text x="395" y="123" text-anchor="middle" font-size="18" fill="#214b53">结果与账务记录</text>
    </g>
    <g fill="#fff" stroke="#c7dcd7">
      <rect x="42" y="248" width="179" height="39" rx="10"/><rect x="238" y="248" width="179" height="39" rx="10"/>
      <rect x="434" y="248" width="179" height="39" rx="10"/><rect x="630" y="248" width="179" height="39" rx="10"/>
      <rect x="826" y="248" width="179" height="39" rx="10"/><rect x="1022" y="248" width="215" height="39" rx="10"/>
    </g>
    <g fill="#27555b" font-size="17" text-anchor="middle">
      <text x="132" y="273">智能转账</text><text x="328" y="273">账单分析</text><text x="524" y="273">理财操作</text>
      <text x="720" y="273">卡片管理</text><text x="916" y="273">订阅与代扣</text><text x="1129" y="273">跨场景联动</text>
